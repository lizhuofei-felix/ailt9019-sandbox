<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>HKD to USD Converter</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #172033;
        --muted: #5b667a;
        --blue: #2463d4;
        --blue-dark: #18499e;
        --blue-soft: #eaf1ff;
        --line: #d7deea;
        --card: #ffffff;
        --page: #f5f8fc;
        --error: #b42318;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, #e9f0ff 0, transparent 38%),
          var(--page);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 520px);
      }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--blue);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 3.25rem);
        line-height: 1.05;
        letter-spacing: -0.04em;
      }

      .intro {
        margin: 16px 0 26px;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.6;
      }

      .card {
        padding: clamp(22px, 5vw, 34px);
        border: 1px solid rgba(36, 99, 212, 0.12);
        border-radius: 24px;
        background: var(--card);
        box-shadow: 0 20px 55px rgba(35, 62, 105, 0.12);
      }

      label {
        display: block;
        margin-bottom: 9px;
        font-weight: 750;
      }

      .input-row {
        display: flex;
        gap: 10px;
      }

      input {
        width: 100%;
        min-width: 0;
        padding: 14px 15px;
        border: 2px solid var(--line);
        border-radius: 12px;
        color: var(--ink);
        background: #fff;
        font: inherit;
        font-size: 1.1rem;
      }

      input:focus {
        border-color: var(--blue);
        outline: 3px solid rgba(36, 99, 212, 0.16);
        outline-offset: 1px;
      }

      button {
        flex: 0 0 auto;
        padding: 0 20px;
        border: 0;
        border-radius: 12px;
        color: #fff;
        background: var(--blue);
        cursor: pointer;
        font: inherit;
        font-weight: 750;
        transition: background 160ms ease, transform 160ms ease;
      }

      button:hover {
        background: var(--blue-dark);
        transform: translateY(-1px);
      }

      button:focus-visible {
        outline: 3px solid rgba(36, 99, 212, 0.3);
        outline-offset: 3px;
      }

      .rate {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .result {
        min-height: 112px;
        display: grid;
        align-content: center;
        margin-top: 26px;
        padding: 18px;
        border-radius: 16px;
        background: var(--blue-soft);
        text-align: center;
      }

      .result-label {
        color: var(--muted);
        font-size: 0.9rem;
      }

      .result-value {
        margin-top: 5px;
        color: var(--blue-dark);
        font-size: clamp(2rem, 7vw, 3rem);
        font-weight: 850;
        letter-spacing: -0.04em;
      }

      .error {
        min-height: 1.4em;
        margin: 10px 0 0;
        color: var(--error);
        font-size: 0.9rem;
      }

      .example {
        margin: 24px 0 0;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.5;
      }

      @media (max-width: 430px) {
        .input-row {
          display: grid;
        }

        button {
          min-height: 48px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Tutorial 1 · Live demo</p>
      <h1>HKD to USD</h1>
      <p class="intro">Enter an amount in Hong Kong dollars and see the approximate US dollar value.</p>

      <section class="card" aria-labelledby="converter-title">
        <h2 id="converter-title" hidden>Currency converter</h2>
        <form id="converter-form" novalidate>
          <label for="hkd-amount">Hong Kong dollars (HKD)</label>
          <div class="input-row">
            <input
              id="hkd-amount"
              name="hkd-amount"
              type="number"
              inputmode="decimal"
              min="0"
              step="0.01"
              placeholder="100"
              autocomplete="off"
              required
            />
            <button type="submit">Convert</button>
          </div>
          <p class="rate">Demo rate: 1 HKD = 0.1282 USD</p>
          <p id="error-message" class="error" role="alert"></p>
        </form>

        <div class="result" aria-live="polite">
          <div class="result-label">US dollar value</div>
          <div id="usd-result" class="result-value">$0.00 USD</div>
        </div>

        <p class="example">Example: 100 HKD converts to 12.82 USD at this fixed demo rate.</p>
      </section>
    </main>

    <script>
      const RATE = 0.1282;
      const form = document.querySelector("#converter-form");
      const input = document.querySelector("#hkd-amount");
      const result = document.querySelector("#usd-result");
      const errorMessage = document.querySelector("#error-message");

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const amount = Number(input.value);

        if (!Number.isFinite(amount) || amount < 0 || input.value.trim() === "") {
          errorMessage.textContent = "Enter a valid non-negative HKD amount.";
          result.textContent = "$0.00 USD";
          input.focus();
          return;
        }

        errorMessage.textContent = "";
        result.textContent = `$${(amount * RATE).toFixed(2)} USD`;
      });
    </script>
  </body>
</html>
